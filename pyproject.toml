[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dxf-close"
version = "1.0.0"
description = "Замыкание контуров DXF: сшивка висячих концов и сборка замкнутых полилиний"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SKLFIR" }]
dependencies = [
    "ezdxf>=1.1",
    "matplotlib>=3.5",
]

[project.scripts]
dxf-close = "dxf_close.cli:main"

[project.gui-scripts]
dxf-close-gui = "dxf_close.cli:main"

[tool.setuptools]
packages = ["dxf_close"]

[tool.setuptools.package-data]
dxf_close = ["assets/*"]
